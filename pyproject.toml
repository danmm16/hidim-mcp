[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidim-mcp"
version = "0.2.1"
description = "MCP server that lets Claude analyse, project, tensorize, slice and plot high-dimensional data without pulling it into context"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# pick what you need; everything degrades gracefully without them
umap = ["umap-learn>=0.5"]
io = ["pyarrow>=14", "openpyxl>=3.1", "h5py>=3.9", "xarray>=2023.1", "netCDF4>=1.6"]
all = ["umap-learn>=0.5", "pyarrow>=14", "openpyxl>=3.1", "h5py>=3.9", "xarray>=2023.1", "netCDF4>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
hidim-mcp = "hidim_mcp.server:main"

[tool.setuptools.packages.find]
include = ["hidim_mcp*"]
